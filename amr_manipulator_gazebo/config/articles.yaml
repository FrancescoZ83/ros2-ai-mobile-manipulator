# Article classes: every one is a primitive (box or cylinder) with a generated texture.
# The model origin is the centre of the BASE, so the pose of an article on a shelf is
# simply (x, y, height of the shelf surface). No markers: the classes differ only by
# shape, size and look, because a neural network will have to recognise them.
texture_size: 256

# Limits that come from the robot: gripper opening 85 mm, shelf level spacing
limits:
  gripper_opening: 0.085
  max_height: 0.18

# Texture description, in normalised image coordinates (u to the right, v downwards):
#   base   background colour
#   rects  [u0, v0, u1, v1, colour] drawn in order
#   badge  circle {center, radius (fraction of the width), color, dots {color, n}}
#   noise  standard deviation of the gaussian pixel noise (0-255 scale)
articles:
  - name: cereal_box
    shape: box
    size: [0.070, 0.050, 0.160]        # x, y, z
    mass: 0.25
    texture:
      base: "#e8b630"
      rects:
        - [0.0, 0.00, 1.0, 0.13, "#c8452b"]
        - [0.0, 0.87, 1.0, 1.00, "#c8452b"]
      badge: {center: [0.5, 0.5], radius: 0.30, color: "#fff4d6", dots: {color: "#8a5a2b", n: 40}}
      noise: 6

  - name: juice_carton
    shape: box
    size: [0.060, 0.060, 0.170]
    mass: 0.35
    texture:
      base: "#f4f1e6"
      rects:
        - [0.0, 0.50, 1.0, 1.00, "#4aa84a"]
        - [0.0, 0.46, 1.0, 0.50, "#ffffff"]
      badge: {center: [0.5, 0.40], radius: 0.26, color: "#f08a1c"}
      noise: 6

  - name: soup_can
    shape: cylinder
    size: [0.033, 0.100]               # radius, height
    mass: 0.40
    texture:
      base: "#f4f0e8"
      rects:
        - [0.0, 0.00, 1.0, 0.35, "#c8281e"]
        - [0.0, 0.35, 1.0, 0.40, "#f2c230"]
      badge: {center: [0.5, 0.70], radius: 0.18, color: "#c8281e"}
      noise: 5

  - name: water_bottle
    shape: cylinder
    size: [0.030, 0.180]
    mass: 0.30
    texture:
      base: "#7fc4e6"
      rects:
        - [0.0, 0.30, 1.0, 0.70, "#ffffff"]
        - [0.0, 0.38, 1.0, 0.44, "#1d6fa5"]
        - [0.0, 0.56, 1.0, 0.62, "#1d6fa5"]
      noise: 4

  - name: parcel
    shape: box
    size: [0.100, 0.070, 0.040]
    mass: 0.15
    texture:
      base: "#b98a56"
      rects:
        - [0.44, 0.00, 0.56, 1.00, "#d8c28d"]
        - [0.08, 0.58, 0.38, 0.92, "#f3f3f3"]
        - [0.11, 0.66, 0.35, 0.69, "#222222"]
        - [0.11, 0.76, 0.30, 0.79, "#222222"]
      noise: 8

  - name: jam_jar
    shape: cylinder
    size: [0.035, 0.075]
    mass: 0.30
    texture:
      base: "#8e2f6b"
      rects:
        - [0.0, 0.00, 1.0, 0.18, "#d4a62a"]
        - [0.0, 0.30, 1.0, 0.80, "#f6e9d0"]
      badge: {center: [0.5, 0.55], radius: 0.16, color: "#8e2f6b"}
      noise: 5

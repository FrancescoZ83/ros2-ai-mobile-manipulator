# Warehouse layout. Frame: world, origin at the centre of the building,
# x towards the east, y towards the north, all lengths in metres.
building:
  size: [12.0, 8.0]          # inner size along x and y

wall:
  thickness: 0.15
  height: 2.5
  color: [0.85, 0.85, 0.82, 1.0]

# Internal walls running along y, with doorways (a door is [centre y, width])
partitions:
  - name: west
    x: -3.0
    doors:
      - [0.0, 1.2]
      - [-3.0, 1.2]
  - name: east
    x: 3.0
    doors:
      - [0.0, 1.2]
      - [3.0, 1.2]

# Shelving: rows of identical units, accessible from both long sides.
# Level 1 is the top of a solid plinth: it is tall enough to cross the LiDAR scan plane,
# so shelves appear in the scan as solid rectangles. Levels above are open boards.
shelf:
  unit: [1.2, 0.8]               # width along x, depth along y
  levels: [0.30, 0.60, 0.90]     # height of the TOP surface of each level
  board_thickness: 0.03
  upright_size: 0.05             # square section
  upright_height: 1.10
  colors:
    plinth: [0.30, 0.33, 0.38, 1.0]
    board: [0.80, 0.68, 0.48, 1.0]
    upright: [0.20, 0.28, 0.40, 1.0]
  rows:
    - name: S                    # units are named S1, S2, ... from x_start towards +x
      x_start: -2.4
      y: -1.3
      units: 4
    - name: N
      x_start: -2.4
      y: 1.3
      units: 3

# Work benches: a solid cabinet (seen by the LiDAR) with an overhanging top at 'height'
tables:
  - name: receiving_table
    centre: [-4.8, 0.0]
    size: [0.8, 1.6]
    height: 0.75
  - name: packing_table
    centre: [4.8, 0.0]
    size: [0.8, 1.6]
    height: 0.75

# Open bins standing on a table (drop-off targets for the order)
bins:
  - name: bin_1
    table: packing_table
    centre: [4.8, -0.35]
    size: [0.30, 0.30, 0.12]
  - name: bin_2
    table: packing_table
    centre: [4.8, 0.35]
    size: [0.30, 0.30, 0.12]

# Square columns: asymmetric features that help SLAM tell the shelf rows apart
columns:
  - name: column_1
    centre: [1.8, -3.0]
    size: 0.4
  - name: column_2
    centre: [-1.5, 3.0]
    size: 0.4

# Zones, as vertical strips of the building (each spans the full y range)
zones:
  - name: receiving
    purpose: incoming goods
    x: [-6.0, -3.0]
  - name: storage
    purpose: storage
    x: [-3.0, 3.0]
  - name: packing
    purpose: order packing and shipping
    x: [3.0, 6.0]

# Stock on the shelves. Every shelf unit has slots on both of its long faces, on every level.
stock:
  slot_pitch: 0.20            # distance between slot centres along the shelf
  face_inset: 0.25            # distance of the article centre from the shelf centreline
  fill: 0.30                  # probability that a slot holds an article
  seed: 1
  yaw_jitter_deg: 15          # random rotation of every article around the vertical axis
  position_jitter: 0.01       # random shift of every article along x and y [m]
  active_faces:               # the face each row is worked from; its articles are dynamic (pickable)
    S: north                  # the other face holds static background stock, which is cheap
    N: south

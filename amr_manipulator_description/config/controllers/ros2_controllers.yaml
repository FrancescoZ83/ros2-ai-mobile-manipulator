controller_manager:
  ros__parameters:
    # Controller update rate (Hz). Must not exceed the 1000 Hz of the simulation step
    update_rate: 500
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_model_controller:
      type: amr_manipulator_control/ArmModelController

    gripper_controller:
      type: amr_manipulator_control/GripperController

arm_model_controller:
  ros__parameters:
    joints: [ur_shoulder_pan_joint, ur_shoulder_lift_joint, ur_elbow_joint,
             ur_wrist_1_joint, ur_wrist_2_joint, ur_wrist_3_joint]
    chain_root: base_link
    chain_tip: gripper_tcp
    robot_description_node: robot_state_publisher
    extra_mass: 0.272
    gravity_scale: 1.0
    pd_scale: 1.0
    ramp_time: 5.0
    target_positions: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
    kp: [150.0, 150.0, 100.0, 30.0, 30.0, 5.0]
    kd: [40.0, 40.0, 25.0, 3.0, 3.0, 0.1]
    effort_limits: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]
    mode: 2
    omega: [20.0, 20.0, 20.0, 30.0, 30.0, 40.0]
    coriolis_scale: 1.0
    velocity_limits: [2.8, 2.8, 2.8, 2.8, 2.8, 2.8]   # ~0.9 * pi, from the URDF limits
    friction_coulomb: [1.0, 1.0, 1.0, 0.3, 0.3, 0.41]   # wrist3 identified from a trace: 0.41 Nm effective in the simulator (URDF: 0.3)
    friction_viscous: [2.0, 2.0, 2.0, 0.5, 0.5, 0.5]
    friction_smoothing: 0.01   # [rad/s] narrower tanh: Coulomb compensated down to low speed
    friction_scale: 1.0
    velocity_noise_std: 0.02
    velocity_filter_hz: 20.0
    noise_seed: 42
    adapt_gain: 0.5          # gamma [kg/(N.m.rad/s)/s]; 0 = adaptation off, tuned at runtime in the tests
    payload_estimate: 0.0    # [kg] initial estimate of the payload on top of extra_mass
    payload_min: 0.0         # [kg] projection bounds of the estimate
    payload_max: 6.0

gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    kp_c: 1500.0
    kd_c: 25.0
    kp_d: 1500.0
    kd_d: 25.0
    fd_max: 10.0
    open_bias: 5.0
    open_speed: 0.10
    approach_speed: 0.05
    approach_force: 12.0
    grip_force: 25.0
    grip_ramp: 0.25
    force_limit: 40.0
    settle_time: 0.12
    stall_ratio: 0.3
    stall_time: 0.03
    contact_force: 1.5
    q_max: 0.04
    open_gap: 0.085
    empty_margin: 0.0008
    empty_force: 5.0